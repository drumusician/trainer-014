# Blaadje is een SvelteKit-app in web/, gebouwd naar statische bestanden.
# De landingspagina staat op /, de app zelf op /app.
[build]
  base = "web"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Oude adressen van voor de verhuizing naar /app.
[[redirects]]
  from = "/instellen"
  to = "/app"
  status = 301

[[redirects]]
  from = "/seizoen"
  to = "/app/archief/seizoen"
  status = 301

[[redirects]]
  from = "/wedstrijd"
  to = "/app/wedstrijd"
  status = 301

[[redirects]]
  from = "/team/*"
  to = "/app/team/:splat"
  status = 301

[[redirects]]
  from = "/archief/*"
  to = "/app/archief/:splat"
  status = 301

[[redirects]]
  from = "/trainingen/*"
  to = "/app/trainingen/:splat"
  status = 301

[[redirects]]
  from = "/meer"
  to = "/app/meer"
  status = 301

# De app is een enkele pagina die zelf routeert. Alles wat geen bestand is gaat
# daarheen, zodat een diep adres als /app/archief/0 geen 404 geeft.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
