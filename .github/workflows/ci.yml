# Het hek. Wat hier rood wordt, hoort niet live te komen.
#
# Netlify draait dezelfde controles in zijn eigen build (zie netlify.toml), zodat
# een deploy ook echt tegengehouden wordt. Deze workflow is er voor de snelle
# terugkoppeling en de geschiedenis: je ziet hier bij welke commit het brak.
name: controle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installeren
        run: npm ci

      - name: Opmaak
        run: npx prettier --check "src/**/*.{ts,svelte,css}"

      - name: Lint
        run: npx eslint .

      - name: Typen
        run: npm run check

      - name: Tests
        run: npm test

      - name: Bouwen
        run: npm run build

  # De regels die bepalen wie bij welk team mag. Dit draait op een echte Postgres
  # met de echte schema.sql erin, dus geen Supabase-project en geen geheimen.
  scheiding:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: proef
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Teams zijn gescheiden
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: proef
        run: supabase/test/draai.sh
