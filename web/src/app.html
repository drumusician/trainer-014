<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
		<meta name="theme-color" content="#2f5d4a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Blaadje" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" href="%sveltekit.assets%/icon-192.png" />

		<!-- Staat hier en niet in een pagina, zodat een link die je in een groepsapp
		     plakt meteen een titel en een plaatje heeft. Losse pagina's zetten hun
		     eigen titel er daarna overheen. -->
		<title>Blaadje — wedstrijdapp voor jeugdtrainers</title>
		<meta
			name="description"
			content="Je opstelling, je wissels en de speeltijd, bijgehouden terwijl je coacht. Werkt zonder bereik en zonder account, gewoon op je telefoon."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Blaadje" />
		<meta property="og:title" content="Blaadje — wedstrijdapp voor jeugdtrainers" />
		<meta
			property="og:description"
			content="Je opstelling, je wissels en de speeltijd, bijgehouden terwijl je coacht. Werkt zonder bereik en zonder account, gewoon op je telefoon."
		/>
		<meta property="og:image" content="https://blaadje.app/scherm-wedstrijd.png" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
