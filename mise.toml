[tools]
node = "latest"

# Er valt niets te bouwen: het is gewoon HTML. Dit zet er alleen een webserver
# voor, want wake lock en service workers werken niet vanaf een file://-adres.
# Poort 8788 staat ook in de Redirect URLs van Supabase, dus het inloggen via
# de link komt hier netjes terug.
[tasks.dev]
description = "Blaadje lokaal draaien op http://localhost:8788"
run = "python3 -m http.server 8788 --directory app"

# Snelle syntaxcontrole van het script in index.html, zonder browser.
[tasks.check]
description = "JavaScript in app/index.html nakijken"
run = """
python3 -c "import io,re,sys; src=io.open('app/index.html',encoding='utf-8').read(); sys.stdout.write(re.search(r'<script>\\n(.*)</script>', src, re.S).group(1))" > /tmp/blaadje-check.js
node --check /tmp/blaadje-check.js && echo 'JavaScript in orde'
"""
