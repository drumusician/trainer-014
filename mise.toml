[tools]
node = "latest"

# Blaadje staat in web/ (SvelteKit). Alles draait vanaf de repo-root.

[tasks.dev]
description = "Blaadje lokaal draaien op http://localhost:5173"
dir = "web"
run = "npm run dev"

[tasks.build]
description = "Blaadje bouwen naar web/build"
dir = "web"
run = "npm run build"

[tasks.preview]
description = "De gebouwde versie draaien op http://localhost:4173"
dir = "web"
run = "npm run preview -- --port 4173"

[tasks.test]
description = "Alle tests: de rekenkern en elk scherm"
dir = "web"
run = "npm run test"

[tasks.controle]
description = "Het hele hek: opmaak, lint, typen, tests en de dekkingsdrempel"
dir = "web"
run = "npm run controle"

[tasks.scheiding]
description = "Bewijzen dat trainers niet bij elkaars team kunnen (echte Postgres)"
run = "./supabase/test/draai.sh"

[tasks.check]
description = "Types en Svelte-code nakijken"
dir = "web"
run = "npm run check"

[tasks.oud]
description = "De oude versie van één HTML-bestand op http://localhost:8788"
run = "python3 -m http.server 8788 --directory app"
