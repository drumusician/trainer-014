<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opstelling — O14</title>
<style>
  :root {
    --groen: #2f5d4a;
    --groen-licht: #e7efeb;
    --inkt: #1c2321;
    --grijs: #6b7773;
    --lijn: #dfe5e2;
    --oranje: #c1541f;
    --oranje-licht: #fdf0e7;
    --bank: #f4f6f5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: var(--inkt);
    background: #fff;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px env(safe-area-inset-bottom); }

  header {
    position: sticky; top: 0; z-index: 5; background: #fff;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--lijn);
    max-width: 560px; margin: 0 auto;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .telling { font-size: 13px; color: var(--grijs); font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 15px; padding: 8px 12px;
    border: 1px solid var(--lijn); border-radius: 8px;
    background: #fff; color: var(--inkt); cursor: pointer;
  }
  button:active { background: #f2f5f3; }
  button.prim { background: var(--groen); border-color: var(--groen); color: #fff; }

  /* ---------- wedstrijdscherm ---------- */
  .linie { padding: 14px 0 4px; border-bottom: 1px solid var(--lijn); }
  .linie:last-of-type { border-bottom: 0; }
  .linie h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--groen); margin: 0 0 8px;
  }
  .rij { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .bankkop { font-size: 12px; color: var(--grijs); margin: 0 0 6px; }

  .speler {
    display: flex; align-items: baseline; gap: 6px;
    min-height: 52px; padding: 10px 14px;
    border: 1.5px solid var(--groen); border-radius: 10px;
    background: var(--groen-licht); color: var(--inkt);
    font-size: 17px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .speler .beurten {
    font-size: 12px; font-weight: 500; color: var(--grijs);
    font-variant-numeric: tabular-nums;
  }
  .speler.bank {
    background: var(--bank); border-color: var(--lijn); font-weight: 500;
    min-height: 46px; padding: 8px 12px; font-size: 16px;
  }
  .speler.gekozen {
    background: var(--oranje); border-color: var(--oranje); color: #fff;
  }
  .speler.gekozen .beurten { color: rgba(255,255,255,.75); }
  .speler.doel { border-color: var(--oranje); background: var(--oranje-licht); }
  .speler.andereLinie { opacity: .55; }
  .leegtekst { color: var(--grijs); font-size: 14px; padding: 4px 0 10px; }

  .balk {
    position: sticky; bottom: 0; z-index: 5;
    background: var(--oranje-licht); border-top: 1px solid var(--oranje);
    padding: 12px; text-align: center; font-size: 15px; color: #7a3a15;
    max-width: 560px; margin: 0 auto;
  }
  .balk b { color: var(--oranje); }
  .balk button { margin-left: 10px; }

  /* ---------- instellen ---------- */
  .instel { padding: 12px 0 40px; }
  .instel p.uitleg { color: var(--grijs); font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
  .sregel {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--lijn);
  }
  .sregel .naam { flex: 1; font-size: 16px; }
  .keuze { display: flex; gap: 4px; }
  .keuze button {
    width: 38px; padding: 8px 0; text-align: center;
    font-size: 14px; font-weight: 600; color: var(--grijs);
  }
  .keuze button.aan { background: var(--groen); border-color: var(--groen); color: #fff; }
  .basis {
    width: 44px; padding: 8px 0; text-align: center; font-size: 14px;
    color: var(--grijs);
  }
  .basis.aan { background: var(--groen-licht); border-color: var(--groen); color: var(--groen); font-weight: 600; }
  .knoprij { display: flex; gap: 8px; margin: 18px 0 0; flex-wrap: wrap; }
  .waarschuwing { color: var(--oranje); font-size: 14px; margin: 10px 0 0; }
  input.nieuwe {
    font: inherit; font-size: 16px; padding: 9px 12px; flex: 1; min-width: 140px;
    border: 1px solid var(--lijn); border-radius: 8px;
  }

  .verborgen { display: none !important; }

  @media print {
    header, .balk, .knoprij, .verborgen-bij-print { display: none !important; }
    body { font-size: 12pt; }
    .speler { border: 1px solid #999; background: #fff !important; color: #000 !important; }
  }
</style>
</head>
<body>

<header>
  <h1 id="kop">Opstelling — O14</h1>
  <span class="telling" id="telling"></span>
  <button id="wisselknop" onclick="wisselScherm()">Instellen</button>
</header>

<div class="wrap">

  <!-- ============ WEDSTRIJD ============ -->
  <div id="wedstrijd"></div>

  <!-- ============ INSTELLEN ============ -->
  <div id="instellen" class="instel verborgen">
    <p class="uitleg">
      Zet per speler de linie: <b>K</b> keeper, <b>V</b> verdediging, <b>M</b> middenveld, <b>A</b> aanval.
      Met <b>basis</b> geef je aan wie begint. De rest start op de bank.
    </p>
    <div id="spelerlijst"></div>
    <p class="waarschuwing" id="waarschuwing"></p>
    <div class="knoprij">
      <input class="nieuwe" id="nieuwenaam" placeholder="Speler toevoegen" enterkeyhint="done">
      <button onclick="spelerErbij()">Toevoegen</button>
    </div>
    <div class="knoprij">
      <button class="prim" onclick="wisselScherm()">Naar de wedstrijd</button>
      <button onclick="nieuweWedstrijd()">Nieuwe wedstrijd</button>
      <button onclick="window.print()">Printen</button>
    </div>
  </div>

</div>

<script>
'use strict';

const LINIES = [
  ['A', 'Aanval'],
  ['M', 'Middenveld'],
  ['V', 'Verdediging'],
  ['K', 'Keeper'],
];

const STANDAARD = [
  'Casper','Maher','Daan','Max','Kasper','Mauro','Yassir','Zenith',
  'Enrico','Amir','Mirza','Simon','Alain','Daanish','Siem','Jack','Gijs',
];

const SLEUTEL = 'o14-opstelling';

let spelers = [];
let gekozen = null;     // speler die eruit gaat
let schermInstellen = false;

/* ---------- bewaren ---------- */
function bewaar() {
  try { localStorage.setItem(SLEUTEL, JSON.stringify(spelers)); } catch (e) { /* stil */ }
}

function laad() {
  try {
    const opgeslagen = JSON.parse(localStorage.getItem(SLEUTEL));
    if (Array.isArray(opgeslagen) && opgeslagen.length) { spelers = opgeslagen; return; }
  } catch (e) { /* stil */ }
  spelers = STANDAARD.map(naam => ({
    naam,
    linie: naam === 'Enrico' ? 'K' : '',
    basis: false,
    inVeld: false,
    bankbeurten: 0,
  }));
}

/* ---------- wedstrijdscherm ---------- */
function tekenWedstrijd() {
  const doel = document.getElementById('wedstrijd');
  doel.innerHTML = '';

  const inVeld = spelers.filter(s => s.inVeld).length;
  document.getElementById('telling').textContent = inVeld + ' in het veld';

  if (!spelers.some(s => s.linie)) {
    doel.innerHTML = '<p class="leegtekst" style="padding-top:20px">' +
      'Nog niemand ingedeeld. Ga naar <b>Instellen</b> en zet per speler de linie en wie er begint.</p>';
    return;
  }

  LINIES.forEach(([code, naam]) => {
    const veld = spelers.filter(s => s.linie === code && s.inVeld);
    const bank = spelers.filter(s => s.linie === code && !s.inVeld)
                        .sort((a, b) => b.bankbeurten - a.bankbeurten || a.naam.localeCompare(b.naam));
    if (!veld.length && !bank.length) return;

    const blok = document.createElement('div');
    blok.className = 'linie';
    blok.innerHTML = '<h2>' + naam + '</h2>';

    const rij = document.createElement('div');
    rij.className = 'rij';
    if (veld.length) veld.forEach(s => rij.appendChild(chip(s, false)));
    else rij.innerHTML = '<p class="leegtekst">Niemand in het veld</p>';
    blok.appendChild(rij);

    if (bank.length) {
      const kop = document.createElement('p');
      kop.className = 'bankkop';
      kop.textContent = 'Bank — bovenaan wie het langst wacht';
      blok.appendChild(kop);
      const bankrij = document.createElement('div');
      bankrij.className = 'rij';
      bank.forEach(s => bankrij.appendChild(chip(s, true)));
      blok.appendChild(bankrij);
    }

    doel.appendChild(blok);
  });

  if (gekozen) {
    const balk = document.createElement('div');
    balk.className = 'balk';
    balk.innerHTML = '<b>' + gekozen.naam + '</b> gaat eruit. Tik nu wie erin komt.' +
      ' <button onclick="annuleer()">Annuleren</button>';
    doel.appendChild(balk);
  }
}

function chip(s, opBank) {
  const el = document.createElement('div');
  el.className = 'speler' + (opBank ? ' bank' : '');
  if (gekozen === s) el.className += ' gekozen';
  else if (gekozen && opBank) {
    el.className += ' doel';
    if (s.linie !== gekozen.linie) el.className += ' andereLinie';
  }
  el.innerHTML = '<span>' + s.naam + '</span>' +
    (s.bankbeurten ? '<span class="beurten">' + s.bankbeurten + '×</span>' : '');
  el.onclick = () => tik(s, opBank);
  return el;
}

function tik(s, opBank) {
  if (!gekozen) {
    if (opBank) {                      /* iemand van de bank erin zetten zonder wissel */
      s.inVeld = true;
      bewaar();
    } else {
      gekozen = s;                     /* eerst: wie gaat eruit */
    }
    tekenWedstrijd();
    return;
  }

  if (s === gekozen) { gekozen = null; tekenWedstrijd(); return; }

  if (opBank) {                        /* de wissel */
    gekozen.inVeld = false;
    gekozen.bankbeurten += 1;
    s.inVeld = true;
    if (s.linie !== gekozen.linie) s.linie = gekozen.linie;   /* neemt de plek over */
    gekozen = null;
    bewaar();
    tekenWedstrijd();
    return;
  }

  gekozen = s;                         /* andere veldspeler aangetikt: die gaat eruit */
  tekenWedstrijd();
}

function annuleer() { gekozen = null; tekenWedstrijd(); }

/* ---------- instelscherm ---------- */
function tekenInstellen() {
  const doel = document.getElementById('spelerlijst');
  doel.innerHTML = '';

  spelers.forEach((s, i) => {
    const regel = document.createElement('div');
    regel.className = 'sregel';

    const naam = document.createElement('span');
    naam.className = 'naam';
    naam.textContent = s.naam;
    regel.appendChild(naam);

    const keuze = document.createElement('div');
    keuze.className = 'keuze';
    ['K','V','M','A'].forEach(code => {
      const b = document.createElement('button');
      b.textContent = code;
      if (s.linie === code) b.className = 'aan';
      b.onclick = () => {
        s.linie = (s.linie === code) ? '' : code;
        if (!s.linie) { s.basis = false; s.inVeld = false; }
        bewaar(); tekenInstellen();
      };
      keuze.appendChild(b);
    });
    regel.appendChild(keuze);

    const basis = document.createElement('button');
    basis.className = 'basis' + (s.basis ? ' aan' : '');
    basis.textContent = 'basis';
    basis.onclick = () => {
      if (!s.linie) return;
      s.basis = !s.basis;
      s.inVeld = s.basis;
      bewaar(); tekenInstellen(); controleer();
    };
    regel.appendChild(basis);

    doel.appendChild(regel);
  });

  controleer();
}

function controleer() {
  const basis = spelers.filter(s => s.basis).length;
  const zonder = spelers.filter(s => !s.linie).length;
  const stukjes = [];
  if (basis !== 11) stukjes.push(basis + ' in de basis (11 verwacht)');
  if (zonder) stukjes.push(zonder + ' nog zonder linie');
  document.getElementById('waarschuwing').textContent = stukjes.join(' · ');
}

function spelerErbij() {
  const veld = document.getElementById('nieuwenaam');
  const naam = veld.value.trim();
  if (!naam) return;
  spelers.push({ naam, linie: '', basis: false, inVeld: false, bankbeurten: 0 });
  veld.value = '';
  bewaar(); tekenInstellen();
}

document.getElementById('nieuwenaam').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); spelerErbij(); }
});

function nieuweWedstrijd() {
  if (!confirm('Nieuwe wedstrijd?\n\nDe basisopstelling blijft staan, iedereen gaat terug naar zijn startplek en de tellers gaan op nul.')) return;
  spelers.forEach(s => { s.inVeld = s.basis; s.bankbeurten = 0; });
  gekozen = null;
  bewaar(); tekenInstellen(); tekenWedstrijd();
}

/* ---------- schakelen ---------- */
function wisselScherm() {
  schermInstellen = !schermInstellen;
  document.getElementById('instellen').classList.toggle('verborgen', !schermInstellen);
  document.getElementById('wedstrijd').classList.toggle('verborgen', schermInstellen);
  document.getElementById('wisselknop').textContent = schermInstellen ? 'Naar de wedstrijd' : 'Instellen';
  document.getElementById('kop').textContent = schermInstellen ? 'Instellen — O14' : 'Opstelling — O14';
  if (schermInstellen) tekenInstellen(); else { gekozen = null; tekenWedstrijd(); }
}

/* ---------- start ---------- */
laad();
tekenInstellen();
tekenWedstrijd();
if (!spelers.some(s => s.basis)) wisselScherm();
</script>

</body>
</html>
