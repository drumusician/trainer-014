<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f5d4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blaadje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Blaadje — wedstrijdapp</title>
<style>
  :root {
    --groen: #2f5d4a;
    --groen-diep: #24483a;
    --groen-licht: #e7efeb;
    --gras: #4b8b5f;
    --gras-donker: #427c55;
    --inkt: #16201d;
    --grijs: #6b7773;
    --lijn: #dfe5e2;
    --bank: #f3f5f4;
    --oranje: #c1541f;
    --oranje-licht: #fdf1e8;
    --rood: #a8342a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: var(--inkt); background: #fff; font-size: 17px;
    -webkit-text-size-adjust: 100%;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app { max-width: 900px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---------- balken ---------- */
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--lijn); flex: none;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 700; }
  header .stand { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px; }

  button {
    font: inherit; font-size: 15px; padding: 9px 13px;
    border: 1px solid var(--lijn); border-radius: 9px;
    background: #fff; color: var(--inkt); cursor: pointer;
  }
  button:active { background: #eef1f0; }
  button.prim { background: var(--groen); border-color: var(--groen); color: #fff; }
  button.prim:active { background: var(--groen-diep); }
  button.uit { border-color: var(--oranje); color: var(--oranje); }
  button.klein { font-size: 13px; padding: 6px 9px; }
  button:disabled { opacity: .4; }

  .klokbalk {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 8px 12px; background: var(--groen); color: #fff;
  }
  .klok { font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .helft { font-size: 12px; opacity: .8; flex: 1; }
  .klokbalk button { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff; }
  .klokbalk button:active { background: rgba(255,255,255,.28); }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .pad { padding: 12px; max-width: 620px; margin: 0 auto; }

  /* ---------- veld ---------- */
  .veld {
    position: relative; margin: 10px 12px 4px;
    background: var(--gras); border-radius: 10px; overflow: hidden;
    aspect-ratio: 4 / 5;
  }
  .veld .strepen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plek {
    position: absolute; transform: translate(-50%, -50%);
    width: 21%; min-width: 62px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; user-select: none;
  }
  .plek .bol {
    width: 100%; padding: 5px 2px; border-radius: 8px;
    background: rgba(255,255,255,.94); border: 2px solid transparent;
    font-size: 13px; font-weight: 700; line-height: 1.15; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .plek .pos { font-size: 10px; color: rgba(255,255,255,.85); font-weight: 700; letter-spacing: .04em; }
  .plek.leeg .bol { background: rgba(255,255,255,.3); color: rgba(255,255,255,.9); font-weight: 500; }
  .plek.gekozen .bol { background: var(--oranje); border-color: #fff; color: #fff; }

  /* ---------- bank ---------- */
  .bankkop {
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 12px 6px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--groen); font-weight: 700;
  }
  .bankkop span { text-transform: none; letter-spacing: 0; color: var(--grijs); font-weight: 400; }
  .groepkop {
    display: flex; align-items: baseline; gap: 6px;
    padding: 2px 12px 5px; font-size: 12px; color: var(--grijs);
  }
  .groepkop b { color: var(--inkt); font-size: 12px; font-weight: 700; }
  .groepkop.past b { color: var(--oranje); }
  .groepkop.past { color: var(--oranje); }
  .rij { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 12px 12px; }

  /* ---------- veld met de bank ernaast ----------
     Het veld schaalt op HOOGTE, niet op breedte: het pakt de ruimte tussen de
     klok en de knoppen, en nooit meer dan dat. Daardoor hoef je tijdens een
     wedstrijd nergens te scrollen, op geen enkel scherm.
     --chroom is alles wat er buiten het veld staat: balken, knoppen, marges. */
  .veldscherm { display: flex; flex-direction: column; height: 100%; --chroom: 200px; }
  .veldscherm.zonderklok { --chroom: 150px; }
  .veldscherm .knoprij { margin-top: auto; }

  .veldrij { display: flex; gap: 10px; align-items: flex-start; justify-content: center;
             margin: 8px 10px 4px; min-height: 0; }
  .veldrij .veld {
    margin: 0; flex: 0 0 auto; aspect-ratio: 5 / 8;
    width: min(calc(100% - 106px), 470px);
    width: min(calc(100% - 106px), calc((100dvh - var(--chroom)) * 0.625), 470px);
    container-type: inline-size;
  }
  /* De namen schalen mee met het veld. cqw is een procent van de veldbreedte,
     dus op een telefoon net passend en op een laptop gewoon groot. */
  .veldrij .plek { width: 22%; min-width: 0; }
  .veldrij .plek .bol { font-size: 11px; padding: 4px 3px; letter-spacing: -.01em; }
  .veldrij .plek .bol { font-size: clamp(10px, 4.3cqw, 16px); padding: .35em .25em; }
  .veldrij .plek .pos { font-size: 9px; }
  .veldrij .plek .pos { font-size: clamp(8px, 2.9cqw, 11px); }

  .banknaast { flex: 1 1 96px; min-width: 92px; max-width: 190px; align-self: stretch;
               display: flex; flex-direction: column; min-height: 0; }
  .banknaast .bankkop { padding: 0 0 4px; }
  .banknaast .groepen { overflow-y: auto; min-height: 0; }
  .banknaast .groepkop { padding: 5px 0 4px; font-size: 11px; justify-content: space-between; }
  .banknaast .groepkop span { font-variant-numeric: tabular-nums; }
  .banknaast .groepkop b { font-size: 11px; }
  .banknaast .rij { flex-direction: column; flex-wrap: nowrap; gap: 5px; padding: 0; }
  .banknaast .chip {
    width: 100%; padding: 6px 8px; min-height: 44px; font-size: 14px;
    flex-direction: column; align-items: flex-start; gap: 0; justify-content: center;
  }
  .banknaast .chip > span:first-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banknaast p.uitleg { margin: 0; font-size: 13px; }
  .chip {
    display: flex; align-items: baseline; gap: 5px;
    min-height: 44px; padding: 9px 12px;
    border: 1px solid var(--lijn); border-radius: 9px; background: var(--bank);
    font-size: 16px; cursor: pointer; user-select: none;
  }
  .chip .min { font-size: 12px; color: var(--grijs); font-variant-numeric: tabular-nums; }
  .chip.doel { border-color: var(--oranje); background: var(--oranje-licht); }
  .chip.andere { opacity: .55; }

  .melding {
    position: sticky; bottom: 0; z-index: 4;
    background: var(--oranje-licht); border-top: 1px solid var(--oranje);
    padding: 11px 12px; font-size: 15px; color: #7a3a15;
    display: flex; align-items: center; gap: 10px;
  }
  .melding b { color: var(--oranje); }
  .melding span { flex: 1; }

  .knoprij { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 12px; }
  .knoprij.vast { flex: none; border-top: 1px solid var(--lijn); padding-top: 12px; }

  /* ---------- instellen ---------- */
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--groen); margin: 22px 0 8px; }
  h2:first-child { margin-top: 0; }
  p.uitleg { color: var(--grijs); font-size: 14px; line-height: 1.5; margin: 0 0 12px; }
  label.vak { display: block; margin-bottom: 12px; font-size: 14px; color: var(--grijs); }
  label.vak input, label.vak select, textarea {
    display: block; width: 100%; margin-top: 4px;
    font: inherit; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--lijn); border-radius: 9px; background: #fff; color: var(--inkt);
  }
  textarea { min-height: 120px; line-height: 1.5; }
  .tweekolom { display: flex; gap: 10px; }
  .tweekolom > * { flex: 1; }

  .sregel { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--lijn); }
  .sregel .naam { flex: 1; font-size: 16px; }
  .keuze { display: flex; gap: 3px; }
  .keuze button { width: 34px; padding: 7px 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--grijs); }
  .keuze button.aan { background: var(--groen); border-color: var(--groen); color: #fff; }

  .presknop { width: 128px; text-align: center; font-size: 14px; }
  .presknop.ja { background: var(--groen); border-color: var(--groen); color: #fff; }
  .presknop.af { background: var(--bank); color: var(--grijs); }
  .presknop.nee { background: var(--oranje-licht); border-color: var(--oranje); color: var(--oranje); }
  .telling { display: flex; gap: 12px; font-size: 13px; color: var(--grijs); margin: 0 0 12px; }
  .mager { color: var(--oranje); font-weight: 700; }

  table.uitslag { width: 100%; border-collapse: collapse; }
  table.uitslag td { padding: 8px 4px; border-bottom: 1px solid var(--lijn); font-size: 15px; }
  table.uitslag td.m { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  table.uitslag td.balk { width: 40%; }
  .staaf { height: 8px; background: var(--groen-licht); border-radius: 4px; overflow: hidden; }
  .staaf i { display: block; height: 100%; background: var(--groen); }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  ul.log li { padding: 6px 0; border-bottom: 1px solid var(--lijn); display: flex; gap: 10px; }
  ul.log li b { font-variant-numeric: tabular-nums; color: var(--grijs); font-weight: 600; min-width: 46px; }
  ul.log li span { flex: 1; }
  ul.log li.klikbaar { cursor: pointer; align-items: center; padding: 12px 0; }
  ul.log li.klikbaar:active { background: #f3f5f4; }
  ul.log li em { font-style: normal; color: var(--grijs); font-size: 18px; line-height: 1; }
  table.uitslag td span.sub { display: block; font-size: 12px; color: var(--grijs); margin-top: 2px; }

  .waarschuwing { color: var(--oranje); font-size: 14px; margin: 10px 0 0; }
  .verborgen { display: none !important; }
  .wakker { font-size: 11px; opacity: .75; }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1 id="kop">O14</h1>
    <span class="stand verborgen" id="stand"></span>
    <button class="klein" id="menuknop" onclick="naarScherm('instellen')">Instellen</button>
  </header>

  <div class="klokbalk verborgen" id="klokbalk">
    <div>
      <div class="klok" id="klok">00:00</div>
      <div class="helft" id="helftlabel">1e helft</div>
    </div>
    <div style="flex:1"></div>
    <button id="loopknop" onclick="loopToggle()">Start</button>
    <button id="rustknop" onclick="rustToggle()">Rust</button>
  </div>

  <main id="scherm"></main>

</div>

<script>
'use strict';

/* ==========================================================
   O14 — wedstrijdapp
   Alles staat lokaal op dit toestel. Geen namen in de code.
   ========================================================== */

const SLEUTEL = 'o14-app-v1';
const SESSIESLEUTEL = 'o14-sessie-v1';

/* Supabase. Deze twee mogen openbaar zijn: de publishable key geeft uit zichzelf
   nergens toegang toe. Row Level Security bepaalt wat een ingelogde trainer mag,
   en dat is alleen zijn eigen team. */
const SUPABASE = {
  url: 'https://gdsqdsxflueawfipjqbw.supabase.co',
  sleutel: 'sb_publishable_Qrjs4tqjHTAGs-p7zsvNHw_CV5WHNtP',
};

const FORMATIES = {
  '4-3-3': [
    ['K',  'K',  50, 92, 'K'],
    ['RV', 'RV', 88, 73, 'V'], ['CVr','CV', 64, 79, 'V'], ['CVl','CV', 36, 79, 'V'], ['LV','LV', 12, 73, 'V'],
    ['MR', 'M',  75, 55, 'M'], ['MC', 'M',  50, 61, 'M'], ['ML','M',  25, 55, 'M'],
    ['RB', 'RB', 80, 26, 'A'], ['SP', 'SP', 50, 18, 'A'], ['LB','LB', 20, 26, 'A'],
  ],
  '4-4-2': [
    ['K',  'K',  50, 92, 'K'],
    ['RV', 'RV', 88, 75, 'V'], ['CVr','CV', 64, 80, 'V'], ['CVl','CV', 36, 80, 'V'], ['LV','LV', 12, 75, 'V'],
    ['MR', 'RM', 88, 51, 'M'], ['MCr','M',  63, 57, 'M'], ['MCl','M',  37, 57, 'M'], ['ML','LM', 12, 51, 'M'],
    ['SPr','SP', 62, 22, 'A'], ['SPl','SP', 38, 22, 'A'],
  ],
  '4-2-3-1': [
    ['K',  'K',  50, 92, 'K'],
    ['RV', 'RV', 88, 75, 'V'], ['CVr','CV', 64, 80, 'V'], ['CVl','CV', 36, 80, 'V'], ['LV','LV', 12, 75, 'V'],
    ['VMr','VM', 64, 62, 'M'], ['VMl','VM', 36, 62, 'M'],
    ['RA', 'RA', 84, 38, 'A'], ['TIEN','10', 50, 43, 'A'], ['LA','LA', 16, 38, 'A'],
    ['SP', 'SP', 50, 18, 'A'],
  ],
};

const LINIES = { A: 'Aanval', M: 'Middenveld', V: 'Verdediging', K: 'Keeper', '': 'Zonder linie' };
/* Van boven naar beneden, net als op het veld: de aanval staat bovenaan. */
const LINIEVOLGORDE = ['A', 'M', 'V', 'K', ''];

/* Bij welke linie hoort een plek in de opstelling? */
function plekLinie(plekId, formatie) {
  const rij = (FORMATIES[formatie] || []).filter(r => r[0] === plekId)[0];
  return rij ? rij[4] : '';
}
/* Wie kan er keepen. Vroeger was 'K' een linie; nu staat het los, zodat een
   verdediger die ook keept in beide lijstjes kan staan. */
function kanKeepen(p) { return !!p.keept; }
function groepVan(p) {
  if (p.linie === 'V' || p.linie === 'M' || p.linie === 'A') return p.linie;
  return p.keept ? 'K' : '';
}

let s = leeg();
let gekozenPlek = null;      /* plek-id van de speler die eruit gaat */
let archiefIndex = -1;       /* welke bewaarde wedstrijd open staat */
let opzetVoor = 'wedstrijd'; /* 'wedstrijd' of 'standaard' */
let trainingIndex = -1;      /* welke training open staat */
let sessie = null;           /* inlog op dit toestel, los van de teamgegevens */
let inlogFase = 'email';     /* 'email' of 'code' */
let inlogEmail = '';
let syncMelding = '';
let scherm = 'wedstrijd';
let tikker = null;
let wakeLock = null;

function leeg() {
  return {
    spelers: [],                 /* {id, naam, linie} */
    formatie: '4-3-3',
    helftMinuten: 35,
    wedstrijd: null,             /* zie nieuweWedstrijd() */
    standaard: null,             /* {formatie, opstelling, bank} — startpunt voor elke wedstrijd */
    verslagWissels: false,       /* wissels mee in het verslag dat je deelt */
    trainingen: [],              /* [{datum, status: {spelerId: 'ja'|'af'|'nee'}}] */
    archief: [],
  };
}

/* ---------- opslag ---------- */
function bewaar() {
  try { localStorage.setItem(SLEUTEL, JSON.stringify(s)); } catch (e) { /* stil */ }
}
function laad() {
  try {
    const d = JSON.parse(localStorage.getItem(SLEUTEL));
    if (d && Array.isArray(d.spelers)) s = Object.assign(leeg(), d);
    s.spelers.forEach(p => {           /* van vroeger: linie 'K' */
      if (p.linie === 'K') { p.linie = ''; p.keept = true; }
    });
  } catch (e) { /* stil */ }
}

/* ---------- klok ---------- */
function verstreken() {
  const w = s.wedstrijd;
  if (!w) return 0;
  let t = w.verstreken;
  if (w.loopt && w.sinds) t += (Date.now() - w.sinds) / 1000;
  return Math.floor(t);
}
function mmss(sec) {
  const m = Math.floor(sec / 60), r = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function loopToggle() {
  const w = s.wedstrijd;
  if (!w || w.afgelopen) return;
  if (w.loopt) {
    w.verstreken += (Date.now() - w.sinds) / 1000;
    w.loopt = false; w.sinds = null;
    losWakeLock();
  } else {
    if (!w.gebeurtenissen.length) log('start', {});
    w.loopt = true; w.sinds = Date.now();
    pakWakeLock();
  }
  bewaar(); teken();
}

function rustToggle() {
  const w = s.wedstrijd;
  if (!w || w.afgelopen) return;
  if (w.helft === 1) {
    if (w.loopt) loopToggle();
    log('rust', {});
    w.helft = 2;
  } else {
    if (!w.loopt) loopToggle();
  }
  bewaar(); teken();
}

/* ---------- gebeurtenissen ---------- */
function log(type, extra) {
  s.wedstrijd.gebeurtenissen.push(Object.assign({ type, t: verstreken() }, extra));
}

function nieuweWedstrijd(tegenstander, thuis) {
  s.wedstrijd = {
    datum: new Date().toISOString().slice(0, 10),
    tegenstander: tegenstander || 'Tegenstander',
    thuis: thuis !== false,
    formatie: s.formatie,
    opstelling: {},          /* plekId -> spelerId */
    bank: [],                /* spelerIds */
    gebeurtenissen: [],
    verstreken: 0, sinds: null, loopt: false,
    helft: 1, afgelopen: false,
  };
}

/* ---------- speeltijd berekenen ---------- */
/* Wie stond wanneer op welke plek. Alles wat met tijd te maken heeft komt
   hieruit: totale speeltijd, en apart de minuten in het doel. Want een helft
   keepen is geen halve wedstrijd voetballen. */
function veldIntervallen(w) {
  if (!w) return [];
  const eind = w.afgelopen ? eindTijd() : verstreken();
  const wissels = w.gebeurtenissen.filter(g => g.type === 'wissel');

  /* de opstelling zoals hij bij de aftrap was, terugrekenen vanaf nu */
  const start = Object.assign({}, w.opstelling);
  wissels.slice().reverse().forEach(g => {
    if (g.plek && start[g.plek] === g.erin) { start[g.plek] = g.eruit; return; }
    for (const plek in start) {
      if (start[plek] === g.erin) { start[plek] = g.eruit; return; }
    }
  });

  const bezet = {};
  Object.keys(start).forEach(plek => {
    if (start[plek]) bezet[plek] = { speler: start[plek], sinds: 0 };
  });

  const uit = [];
  wissels.forEach(g => {
    let plek = g.plek;
    if (!plek || !bezet[plek] || bezet[plek].speler !== g.eruit) {
      plek = Object.keys(bezet).filter(k => bezet[k].speler === g.eruit)[0] || plek;
    }
    if (plek && bezet[plek]) {
      uit.push({ speler: bezet[plek].speler, plek: plek, van: bezet[plek].sinds, tot: g.t });
    }
    if (plek) bezet[plek] = { speler: g.erin, sinds: g.t };
  });

  Object.keys(bezet).forEach(plek => {
    uit.push({ speler: bezet[plek].speler, plek: plek, van: bezet[plek].sinds, tot: eind });
  });
  return uit;
}

function speeltijden() {
  const totaal = {};
  s.spelers.forEach(p => { totaal[p.id] = 0; });
  veldIntervallen(s.wedstrijd).forEach(i => {
    totaal[i.speler] = (totaal[i.speler] || 0) + (i.tot - i.van);
  });
  return totaal;
}

/* Minuten in het doel, apart geteld. */
function keepertijden() {
  const w = s.wedstrijd;
  const uit = {};
  veldIntervallen(w).forEach(i => {
    if (plekLinie(i.plek, w.formatie) === 'K') uit[i.speler] = (uit[i.speler] || 0) + (i.tot - i.van);
  });
  return uit;
}

function eindTijd() {
  const e = s.wedstrijd.gebeurtenissen.filter(g => g.type === 'eind').pop();
  return e ? e.t : s.wedstrijd.verstreken;
}

function stand() {
  const g = s.wedstrijd.gebeurtenissen;
  return [g.filter(x => x.type === 'goal').length, g.filter(x => x.type === 'tegen').length];
}

/* ---------- schermen ---------- */
function naarScherm(naam) { scherm = naam; gekozenPlek = null; teken(); }

function teken() {
  const doel = document.getElementById('scherm');
  const w = s.wedstrijd;
  const klokbalk = document.getElementById('klokbalk');
  const standEl = document.getElementById('stand');
  const menuknop = document.getElementById('menuknop');

  const inWedstrijd = scherm === 'wedstrijd' && w && !w.afgelopen && Object.keys(w.opstelling).length > 0;
  klokbalk.classList.toggle('verborgen', !inWedstrijd);
  standEl.classList.toggle('verborgen', !inWedstrijd);
  const terug = { seizoen: 'instellen', archief: 'instellen',
                  trainingen: 'instellen', training: 'trainingen' }[scherm];
  menuknop.textContent = scherm === 'wedstrijd' ? 'Instellen' : 'Terug';
  menuknop.onclick = () => naarScherm(terug || (scherm === 'wedstrijd' ? 'instellen' : 'wedstrijd'));

  if (inWedstrijd) {
    document.getElementById('klok').textContent = mmss(verstreken());
    document.getElementById('helftlabel').textContent = w.helft === 1 ? '1e helft' : '2e helft';
    document.getElementById('loopknop').textContent = w.loopt ? 'Pauze' : 'Start';
    document.getElementById('rustknop').textContent = w.helft === 1 ? 'Rust' : '2e helft';
    document.getElementById('rustknop').disabled = w.helft === 2 && w.loopt;
    const [v, t] = stand();
    standEl.textContent = v + ' – ' + t;
    document.getElementById('kop').textContent = (w.thuis ? 'O14 – ' + w.tegenstander : w.tegenstander + ' – O14');
  } else if (scherm === 'seizoen') {
    document.getElementById('kop').textContent = 'Seizoen';
  } else if (scherm === 'trainingen') {
    document.getElementById('kop').textContent = 'Trainingen';
  } else if (scherm === 'training' && s.trainingen[trainingIndex]) {
    document.getElementById('kop').textContent = 'Training ' + datumKort(s.trainingen[trainingIndex].datum);
  } else if (scherm === 'archief' && s.archief[archiefIndex]) {
    const a = s.archief[archiefIndex];
    document.getElementById('kop').textContent = a.datum + ' \u00b7 ' + a.tegenstander;
  } else {
    document.getElementById('kop').textContent = 'O14';
  }

  if (scherm === 'instellen') doel.innerHTML = '', doel.appendChild(schermInstellen());
  else if (scherm === 'afloop') doel.innerHTML = '', doel.appendChild(schermAfloop());
  else if (scherm === 'seizoen') doel.innerHTML = '', doel.appendChild(schermSeizoen());
  else if (scherm === 'archief') doel.innerHTML = '', doel.appendChild(schermArchiefwedstrijd());
  else if (scherm === 'trainingen') doel.innerHTML = '', doel.appendChild(schermTrainingen());
  else if (scherm === 'training') doel.innerHTML = '', doel.appendChild(schermTraining());
  else doel.innerHTML = '', doel.appendChild(schermWedstrijd());
}

/* ---------- wedstrijdscherm ---------- */
function schermWedstrijd() {
  const d = document.createElement('div');
  const w = s.wedstrijd;

  if (!s.spelers.length) {
    d.innerHTML = '<div class="pad"><h2>Nog geen spelers</h2>' +
      '<p class="uitleg">Ga naar <b>Instellen</b> en zet je selectie erin. De namen blijven op dit toestel staan.</p>' +
      '<div class="knoprij" style="padding-left:0"><button class="prim" onclick="naarScherm(\'instellen\')">Instellen</button></div></div>';
    return d;
  }
  if (!w || !Object.keys(w.opstelling).length) {
    d.innerHTML = '<div class="pad"><h2>Nog geen opstelling</h2>' +
      '<p class="uitleg">Maak een wedstrijd aan en zet je basiself op het veld.</p>' +
      '<div class="knoprij" style="padding-left:0"><button class="prim" onclick="naarScherm(\'instellen\')">Wedstrijd opzetten</button></div></div>';
    return d;
  }
  if (w.afgelopen) { return schermAfloop(); }

  const tijden = speeltijden();
  d.className = 'veldscherm';
  const veldrij = document.createElement('div');
  veldrij.className = 'veldrij';
  veldrij.appendChild(tekenVeld(true, w));
  veldrij.appendChild(bankKolom(w, { tijden: tijden }));
  d.appendChild(veldrij);

  const knoppen = document.createElement('div');
  knoppen.className = 'knoprij';
  knoppen.innerHTML =
    '<button class="prim" onclick="doelpunt()">Doelpunt</button>' +
    '<button onclick="tegendoelpunt()">Tegen</button>' +
    (herstelbaar() ? '<button onclick="herstelLaatste()">\u21b6 ' + veiligeTekst(herstelbaar()) + ' terug</button>' : '') +
    '<button class="uit" onclick="beeindig()">Wedstrijd afsluiten</button>';
  d.appendChild(knoppen);

  if (gekozenPlek) {
    const uit = speler(w.opstelling[gekozenPlek]);
    const linie = LINIES[plekLinie(gekozenPlek, w.formatie)] || 'Onbekend';
    const keep = uit ? (keepertijden()[uit.id] || 0) : 0;
    const balk = document.createElement('div');
    balk.className = 'melding';
    balk.innerHTML = '<span><b>' + veiligeTekst(uit ? uit.naam : 'Lege plek') +
      '</b> \u00b7 ' + veiligeTekst(linie.toLowerCase()) + '. Tik wie erin komt.' +
      (keep > 0 && plekLinie(gekozenPlek, w.formatie) !== 'K'
        ? ' Hij keepte deze wedstrijd al ' + Math.round(keep / 60) + ' minuten.'
        : '') + '</span>';
    const annuleer = document.createElement('button');
    annuleer.className = 'klein';
    annuleer.textContent = 'Annuleren';
    annuleer.onclick = () => { gekozenPlek = null; teken(); };
    balk.appendChild(annuleer);
    d.appendChild(balk);
  }

  return d;
}

/* De bank naast het veld: aanval boven, keeper onder, net als de plekken links.
   Dezelfde kolom in de wedstrijd (met minuten) en bij het opstellen (met linie). */
function bankKolom(w, opties) {
  opties = opties || {};
  const tijden = opties.tijden || null;
  const kolom = document.createElement('div');
  kolom.className = 'banknaast';

  const kop = document.createElement('div');
  kop.className = 'bankkop';
  kop.textContent = opties.kop || 'Bank';
  kolom.appendChild(kop);

  const groepen = document.createElement('div');
  groepen.className = 'groepen';
  kolom.appendChild(groepen);

  const bank = w.bank.map(id => speler(id)).filter(Boolean);
  if (!bank.length) {
    const leeg = document.createElement('p');
    leeg.className = 'uitleg';
    leeg.textContent = opties.leegtekst || 'Iedereen speelt.';
    groepen.appendChild(leeg);
    return kolom;
  }

  const doelLinie = gekozenPlek ? plekLinie(gekozenPlek, w.formatie) : null;
  const pastBij = p => doelLinie === 'K' ? kanKeepen(p) : (p.linie || '') === doelLinie;

  LINIEVOLGORDE.forEach(code => {
    const groep = bank.filter(p => groepVan(p) === code).sort((a, b) =>
      tijden ? (tijden[a.id] || 0) - (tijden[b.id] || 0) : a.naam.localeCompare(b.naam));
    if (!groep.length) return;

    const raak = gekozenPlek && groep.some(pastBij);
    const gk = document.createElement('div');
    gk.className = 'groepkop' + (raak ? ' past' : '');
    gk.innerHTML = '<b>' + veiligeTekst(LINIES[code]) + '</b><span>' + groep.length + '</span>';
    groepen.appendChild(gk);

    const rij = document.createElement('div');
    rij.className = 'rij';
    groep.forEach(p => {
      const recent = presentie(p.id, 4);
      const el = document.createElement('div');
      el.className = 'chip';
      if (gekozenPlek) el.className += pastBij(p) ? ' doel' : ' doel andere';
      el.innerHTML = '<span>' + veiligeTekst(p.naam) + '</span>' +
        (tijden
          ? '<span class="min">' + Math.round((tijden[p.id] || 0) / 60) + '\u2032</span>'
          : (mager(recent) ? '<span class="min mager">' + recent.er + '/' + recent.totaal + '</span>' : ''));
      el.onclick = () => (opties.tik || tikBank)(p.id);
      rij.appendChild(el);
    });
    groepen.appendChild(rij);
  });
  return kolom;
}

function tekenVeld(klikbaar, doelW) {
  const w = doelW || s.wedstrijd;
  const veld = document.createElement('div');
  veld.className = 'veld';
  veld.innerHTML =
    '<svg class="strepen" viewBox="0 0 300 400" preserveAspectRatio="none">' +
    '<g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2">' +
    '<rect x="8" y="8" width="284" height="384"/>' +
    '<line x1="8" y1="200" x2="292" y2="200"/>' +
    '<circle cx="150" cy="200" r="46"/>' +
    '<rect x="72" y="8" width="156" height="58"/>' +
    '<rect x="72" y="334" width="156" height="58"/>' +
    '<rect x="115" y="8" width="70" height="22"/>' +
    '<rect x="115" y="370" width="70" height="22"/>' +
    '</g></svg>';

  FORMATIES[w.formatie].forEach(([plekId, label, x, y]) => {
    const id = w.opstelling[plekId];
    const p = speler(id);
    const el = document.createElement('div');
    el.className = 'plek' + (p ? '' : ' leeg') + (gekozenPlek === plekId ? ' gekozen' : '');
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.innerHTML = '<div class="bol">' + veiligeTekst(p ? p.naam : '+') + '</div>' +
                   '<div class="pos">' + label + '</div>';
    if (klikbaar) el.onclick = () => tikPlek(plekId);
    veld.appendChild(el);
  });
  return veld;
}

function tikPlek(plekId) {
  const w = s.wedstrijd;
  if (gekozenPlek === plekId) { gekozenPlek = null; teken(); return; }
  if (!w.opstelling[plekId]) {                     /* lege plek: iemand van de bank erin */
    gekozenPlek = plekId; teken(); return;
  }
  gekozenPlek = plekId; teken();
}

function tikBank(spelerId) {
  const w = s.wedstrijd;
  if (!gekozenPlek) return;                        /* eerst iemand in het veld aantikken */
  const eruit = w.opstelling[gekozenPlek];
  w.opstelling[gekozenPlek] = spelerId;
  w.bank = w.bank.filter(x => x !== spelerId);
  if (eruit) {
    w.bank.push(eruit);
    log('wissel', { eruit, erin: spelerId, plek: gekozenPlek });
  }
  gekozenPlek = null;
  bewaar(); teken();
}

function doelpunt() {
  const w = s.wedstrijd;
  const inVeld = FORMATIES[w.formatie].map(([p]) => w.opstelling[p]).filter(Boolean);
  const namen = inVeld.map((id, i) => (i + 1) + '. ' + speler(id).naam).join('\n');
  const antwoord = prompt('Doelpunt! Wie scoorde?\n\n' + namen + '\n\nTyp het nummer, of laat leeg als je het niet weet.', '');
  if (antwoord === null) return;
  const n = parseInt(antwoord, 10);
  const maker = (n >= 1 && n <= inVeld.length) ? inVeld[n - 1] : null;
  log('goal', { speler: maker });
  bewaar(); teken();
}

function tegendoelpunt() { log('tegen', {}); bewaar(); teken(); }

/* Per ongeluk getikt? De laatste actie kan terug, zolang er niets anders overheen is gegaan. */
function herstelbaar() {
  const g = s.wedstrijd ? s.wedstrijd.gebeurtenissen : [];
  const laatste = g[g.length - 1];
  if (!laatste) return null;
  if (laatste.type === 'goal') return 'Doelpunt';
  if (laatste.type === 'tegen') return 'Tegendoelpunt';
  if (laatste.type === 'wissel') return 'Wissel';
  return null;
}

function herstelLaatste() {
  const w = s.wedstrijd;
  const g = w.gebeurtenissen;
  const laatste = g[g.length - 1];
  if (!herstelbaar()) return;
  if (laatste.type === 'wissel') {
    w.opstelling[laatste.plek] = laatste.eruit;
    w.bank = w.bank.filter(x => x !== laatste.eruit);
    if (!w.bank.includes(laatste.erin)) w.bank.push(laatste.erin);
  }
  g.pop();
  gekozenPlek = null;
  bewaar(); teken();
}

function beeindig() {
  const w = s.wedstrijd;
  if (!confirm('Wedstrijd afsluiten?\n\nDe klok stopt en je krijgt het overzicht met de speeltijden.')) return;
  if (w.loopt) { w.verstreken += (Date.now() - w.sinds) / 1000; w.loopt = false; w.sinds = null; }
  log('eind', {});
  w.afgelopen = true;
  losWakeLock();
  bewaar(); naarScherm('afloop');
}

/* ---------- gedeelde stukjes: speeltijdtabel en verloop ---------- */
/* rijen: [{naam, seconden, sub?}] — gebruikt na afloop, in het archief en bij het seizoen */
function speeltijdHtml(rijen) {
  const langst = Math.max(1, ...rijen.map(r => r.seconden || 0));
  return '<table class="uitslag">' + rijen.slice()
    .sort((a, b) => (b.seconden || 0) - (a.seconden || 0))
    .map(r =>
      '<tr><td>' + veiligeTekst(r.naam) +
        (r.sub ? '<span class="sub">' + veiligeTekst(r.sub) + '</span>' : '') + '</td>' +
      '<td class="balk"><div class="staaf"><i style="width:' +
        Math.round((r.seconden || 0) / langst * 100) + '%"></i></div></td>' +
      '<td class="m">' + Math.round((r.seconden || 0) / 60) + ' min</td></tr>')
    .join('') + '</table>';
}

/* `namen` is de naamlijst zoals hij bij het bewaren was; zonder dat pakken we de selectie van nu. */
function gebeurtenisTekst(g, namen) {
  const naam = id => {
    const p = speler(id);
    return p ? p.naam : ((namen && namen[id]) || 'onbekend');
  };
  if (g.type === 'start') return 'Aftrap';
  if (g.type === 'rust') return 'Rust';
  if (g.type === 'eind') return 'Einde';
  if (g.type === 'tegen') return 'Tegendoelpunt';
  if (g.type === 'goal') return 'Doelpunt' + (g.speler ? ' — ' + naam(g.speler) : '');
  if (g.type === 'wissel') return naam(g.erin) + ' voor ' + naam(g.eruit);
  return g.type;
}

function verloopHtml(gebeurtenissen, namen) {
  return '<ul class="log">' + (gebeurtenissen || []).map(g =>
    '<li><b>' + mmss(g.t) + '</b><span>' + veiligeTekst(gebeurtenisTekst(g, namen)) + '</span></li>'
  ).join('') + '</ul>';
}

/* ---------- verslag om te delen ---------- */
/* bron: een bewaarde wedstrijd, of {datum, tegenstander, thuis, stand, formatie, gebeurtenissen}.
   Wissels blijven er standaard uit: de uitslag is voor iedereen, de opstelling is van de trainer. */
function verslagTekst(bron, metWissels) {
  const st = bron.stand || [0, 0];
  const thuis = bron.thuis !== false;
  const regels = [];
  regels.push((thuis ? 'O14 \u2013 ' + bron.tegenstander : bron.tegenstander + ' \u2013 O14') + ' ' +
    (thuis ? st[0] + '\u2013' + st[1] : st[1] + '\u2013' + st[0]));
  regels.push(datumTekst(bron.datum));
  regels.push('');

  let voor = 0, tegen = 0;
  (bron.gebeurtenissen || []).slice().sort((a, b) => (a.t || 0) - (b.t || 0)).forEach(g => {
    const min = Math.floor((g.t || 0) / 60) + '\u2032';
    if (g.type === 'goal') {
      voor++;
      const p = g.speler ? speler(g.speler) : null;
      const naam = p ? p.naam : (bron.namen && bron.namen[g.speler]);
      regels.push(min + '  ' + voor + '\u2013' + tegen + '  ' + (naam || 'doelpunt'));
    } else if (g.type === 'tegen') {
      tegen++;
      regels.push(min + '  ' + voor + '\u2013' + tegen + '  tegendoelpunt');
    } else if (g.type === 'wissel' && metWissels) {
      const n = id => { const q = speler(id); return q ? q.naam : ((bron.namen && bron.namen[id]) || 'onbekend'); };
      regels.push(min + '       ' + n(g.erin) + ' voor ' + n(g.eruit));
    }
  });
  if (voor + tegen === 0) regels.push('Geen doelpunten.');
  return regels.join('\n');
}

function datumTekst(datum) {
  try {
    const d = new Date(datum + 'T12:00:00');
    return d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (e) { return datum; }
}

/* Het verslag van het scherm waar je nu staat. */
function verslagBron() {
  if (scherm === 'archief') return s.archief[archiefIndex] || null;
  const w = s.wedstrijd;
  if (!w) return null;
  return { datum: w.datum, tegenstander: w.tegenstander, thuis: w.thuis,
           stand: stand(), formatie: w.formatie, gebeurtenissen: w.gebeurtenissen };
}

function kopieerVerslag() {
  const bron = verslagBron();
  if (!bron) return;
  const tekst = verslagTekst(bron, s.verslagWissels);
  try { navigator.clipboard.writeText(tekst); } catch (e) { /* dan met de hand */ }
  const vak = document.getElementById('verslagvak');
  if (!vak) return;
  vak.innerHTML = '<p class="uitleg" style="margin-top:12px">Gekopieerd. Staat er ook hieronder, ' +
    'voor als plakken niet lukt.</p>';
  const t = document.createElement('textarea');
  t.value = tekst;
  t.style.minHeight = '160px';
  vak.appendChild(t);
  t.focus(); t.select();
  vak.scrollIntoView({ block: 'center' });
}

function wisselsInVerslag() {
  s.verslagWissels = !s.verslagWissels;
  bewaar(); teken();
}

function verslagKnoppen() {
  return '<div class="knoprij" style="padding-left:0;margin-top:16px">' +
    '<button class="prim" onclick="kopieerVerslag()">Verslag kopi\u00ebren</button>' +
    '<button onclick="wisselsInVerslag()">Wissels: ' + (s.verslagWissels ? 'wel' : 'niet') + ' mee</button>' +
    '</div><div id="verslagvak"></div>';
}

/* De naam van nu, ook als iemand na de wedstrijd hernoemd is. */
function naamNu(r) {
  const p = r.id ? speler(r.id) : null;
  return p ? p.naam : r.naam;
}

/* ---------- na afloop ---------- */
function schermAfloop() {
  const w = s.wedstrijd;
  const d = document.createElement('div');
  d.className = 'pad';
  if (!w) { d.innerHTML = '<p class="uitleg">Nog geen wedstrijd.</p>'; return d; }

  const [v, t] = stand();
  const tijden = speeltijden();
  const eind = eindTijd();

  let html = '<h2>Uitslag</h2><p style="font-size:22px;font-weight:700;margin:0 0 4px">' +
    veiligeTekst(w.thuis ? 'O14' : w.tegenstander) + ' ' + v + ' – ' + t + ' ' +
    veiligeTekst(w.thuis ? w.tegenstander : 'O14') + '</p>' +
    '<p class="uitleg">' + w.datum + ' · ' + mmss(eind) + ' gespeeld · ' + w.formatie + '</p>';

  html += '<h2>Speeltijd</h2>' + speeltijdHtml(
    s.spelers.filter(p => tijden[p.id] !== undefined)
      .map(p => ({ naam: p.naam, seconden: tijden[p.id] || 0 })));

  html += '<h2>Verloop</h2>' + verloopHtml(w.gebeurtenissen, null);

  html += '<h2>Delen</h2>' +
    '<p class="uitleg">Voor de groepsapp. De wissels laat ik er standaard uit.</p>' +
    verslagKnoppen();

  html += '<div class="knoprij" style="padding-left:0;margin-top:16px">' +
    (w.bewaard
      ? '<button disabled>Bewaard in archief</button>'
      : '<button class="prim" onclick="bewaarInArchief()">Bewaren in archief</button>') +
    '<button onclick="naarScherm(\'instellen\')">Nieuwe wedstrijd</button>' +
    '</div>';

  d.innerHTML = html;
  return d;
}

function bewaarInArchief() {
  const w = s.wedstrijd;
  if (w.bewaard) return;
  const tijden = speeltijden();
  const keepers = keepertijden();
  const namen = {};
  s.spelers.forEach(p => { namen[p.id] = p.naam; });
  s.archief.unshift({
    datum: w.datum, tegenstander: w.tegenstander, thuis: w.thuis,
    stand: stand(), formatie: w.formatie,
    duur: eindTijd(),
    gebeurtenissen: w.gebeurtenissen,
    namen: namen,                    /* de namen van toen, voor het geval de selectie verandert */
    speeltijd: s.spelers.filter(p => tijden[p.id] !== undefined)
      .map(p => ({ id: p.id, naam: p.naam, seconden: Math.round(tijden[p.id]),
                   keeper: Math.round(keepers[p.id] || 0) })),
  });
  w.bewaard = true;
  bewaar();
  alert('Bewaard. Je vindt hem terug onder Instellen \u2192 Archief.');
  naarScherm('instellen');
}

/* ---------- bewaarde wedstrijd terugkijken ---------- */
function openArchief(i) { archiefIndex = i; naarScherm('archief'); }

function schermArchiefwedstrijd() {
  const d = document.createElement('div');
  d.className = 'pad';
  const a = s.archief[archiefIndex];
  const terug = '<div class="knoprij" style="padding-left:0;margin-top:16px">' +
    '<button class="prim" onclick="naarScherm(\'instellen\')">Terug</button>';
  if (!a) {
    d.innerHTML = '<p class="uitleg">Deze wedstrijd staat er niet meer.</p>' + terug + '</div>';
    return d;
  }

  const st = a.stand || [0, 0];
  const thuis = a.thuis !== false;
  let html = '<h2>Uitslag</h2><p style="font-size:22px;font-weight:700;margin:0 0 4px">' +
    veiligeTekst(thuis ? 'O14' : a.tegenstander) + ' ' + st[0] + ' \u2013 ' + st[1] + ' ' +
    veiligeTekst(thuis ? a.tegenstander : 'O14') + '</p>' +
    '<p class="uitleg">' + veiligeTekst(a.datum) + ' \u00b7 ' + mmss(a.duur || 0) + ' gespeeld \u00b7 ' +
    veiligeTekst(a.formatie || '') + '</p>';

  html += '<h2>Speeltijd</h2>' + speeltijdHtml(
    (a.speeltijd || []).map(r => ({ naam: naamNu(r), seconden: r.seconden || 0 })));

  html += '<h2>Verloop</h2>' + verloopHtml(a.gebeurtenissen, a.namen);

  html += '<h2>Delen</h2>' + verslagKnoppen();

  html += terug + '<button class="uit" onclick="verwijderArchief()">Verwijderen</button></div>';
  d.innerHTML = html;
  return d;
}

function verwijderArchief() {
  const a = s.archief[archiefIndex];
  if (!a) return;
  if (!confirm('De wedstrijd tegen ' + a.tegenstander + ' van ' + a.datum + ' uit het archief verwijderen?')) return;
  s.archief.splice(archiefIndex, 1);
  archiefIndex = -1;
  bewaar();
  naarScherm('instellen');
}

/* ---------- trainingen ---------- */
/* Een training is een datum met per speler een stand: er, afgemeld, of niet gekomen.
   Nieuw = iedereen present; je tikt alleen wie er niet is. Dat is het snelst langs de lijn. */
const PRESENTIE = { ja: 'Aanwezig', af: 'Afgemeld', nee: 'Niet gekomen' };
const PRESENTIEVOLGORDE = ['ja', 'af', 'nee'];

function vandaag() { return new Date().toISOString().slice(0, 10); }
function datumKort(d) {
  try {
    return new Date(d + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  } catch (e) { return d; }
}

function sorteerTrainingen() {
  s.trainingen.sort((a, b) => (b.datum || '').localeCompare(a.datum || ''));
}

function nieuweTraining() {
  if (!s.spelers.length) { alert('Zet eerst je selectie erin.'); return; }
  const status = {};
  s.spelers.forEach(p => { status[p.id] = 'ja'; });
  const t = { datum: vandaag(), status: status };
  s.trainingen.unshift(t);
  sorteerTrainingen();
  trainingIndex = s.trainingen.indexOf(t);
  bewaar();
  naarScherm('training');
}

function openTraining(i) { trainingIndex = i; naarScherm('training'); }

function tikPresentie(spelerId) {
  const t = s.trainingen[trainingIndex];
  if (!t) return;
  const nu = t.status[spelerId] || 'ja';
  t.status[spelerId] = PRESENTIEVOLGORDE[(PRESENTIEVOLGORDE.indexOf(nu) + 1) % PRESENTIEVOLGORDE.length];
  bewaar(); teken();
}

function trainingDatum(waarde) {
  const t = s.trainingen[trainingIndex];
  if (!t || !waarde) return;
  const open = t;
  t.datum = waarde;
  sorteerTrainingen();
  trainingIndex = s.trainingen.indexOf(open);
  bewaar(); teken();
}

function verwijderTraining() {
  const t = s.trainingen[trainingIndex];
  if (!t) return;
  if (!confirm('De training van ' + datumKort(t.datum) + ' verwijderen?')) return;
  s.trainingen.splice(trainingIndex, 1);
  trainingIndex = -1;
  bewaar();
  naarScherm('trainingen');
}

function telling(t) {
  const w = { ja: 0, af: 0, nee: 0 };
  s.spelers.forEach(p => { const st = t.status[p.id]; if (st) w[st]++; });
  return w;
}

/* Presentie over de laatste n trainingen waar deze speler in stond. */
function presentie(spelerId, n) {
  let er = 0, totaal = 0;
  for (let i = 0; i < s.trainingen.length && (!n || totaal < n); i++) {
    const st = s.trainingen[i].status[spelerId];
    if (!st) continue;
    totaal++;
    if (st === 'ja') er++;
  }
  return { er: er, totaal: totaal };
}

function schermTrainingen() {
  const d = document.createElement('div');
  d.className = 'pad';
  let html = '<h2>Trainingen</h2>';
  if (!s.trainingen.length) {
    html += '<p class="uitleg">Nog geen trainingen. Maak er een aan; iedereen staat dan op aanwezig ' +
      'en je tikt alleen wie er niet is.</p>';
  } else {
    html += '<p class="uitleg">Tik een training aan om hem bij te werken. De datum kun je daar aanpassen, ' +
      'dus een gemiste week vul je later gewoon in.</p><ul class="log">' +
      s.trainingen.map((t, i) => {
        const w = telling(t);
        return '<li class="klikbaar" onclick="openTraining(' + i + ')"><b>' + veiligeTekst(datumKort(t.datum)) +
          '</b><span>' + w.ja + ' er' + (w.af ? ', ' + w.af + ' afgemeld' : '') +
          (w.nee ? ', ' + w.nee + ' niet gekomen' : '') + '</span><em>\u203a</em></li>';
      }).join('') + '</ul>';
  }
  html += '<div class="knoprij" style="padding-left:0;margin-top:12px">' +
    '<button class="prim" onclick="nieuweTraining()">Nieuwe training</button>' +
    '<button onclick="naarScherm(\'instellen\')">Terug</button></div>';
  d.innerHTML = html;
  return d;
}

function schermTraining() {
  const d = document.createElement('div');
  d.className = 'pad';
  const t = s.trainingen[trainingIndex];
  if (!t) {
    d.innerHTML = '<p class="uitleg">Deze training staat er niet meer.</p>' +
      '<div class="knoprij" style="padding-left:0"><button class="prim" onclick="naarScherm(\'trainingen\')">Terug</button></div>';
    return d;
  }
  const w = telling(t);
  d.innerHTML = '<h2>Training</h2>' +
    '<label class="vak">Datum<input id="trainingdatum" type="date" value="' + veiligeTekst(t.datum) + '"></label>' +
    '<p class="telling"><span>' + w.ja + ' aanwezig</span><span>' + w.af + ' afgemeld</span><span>' +
    w.nee + ' niet gekomen</span></p>' +
    '<p class="uitleg">Tik op de knop achter een naam om hem langs aanwezig, afgemeld en niet gekomen te zetten.</p>' +

  datumveld.onchange = () => trainingDatum(datumveld.value);

/* ---------- seizoen ---------- */
/* Alles uit het archief bij elkaar. Op id waar dat kan, zodat hernoemen niets splitst. */
function seizoenTotalen() {
  const per = {};
  const pak = (sleutel, naam) => {
    if (!per[sleutel]) per[sleutel] = { naam: naam, seconden: 0, keeper: 0, wedstrijden: 0, doelpunten: 0 };
    per[sleutel].naam = naam;
    return per[sleutel];
  };
  s.archief.forEach(a => {
    (a.speeltijd || []).forEach(r => {
      const p = r.id ? speler(r.id) : null;
      const x = pak(p ? 'id:' + p.id : 'naam:' + r.naam, p ? p.naam : r.naam);
      x.seconden += r.seconden || 0;
      x.keeper += r.keeper || 0;
      if ((r.seconden || 0) > 0) x.wedstrijden++;
    });
    (a.gebeurtenissen || []).filter(g => g.type === 'goal' && g.speler).forEach(g => {
      const p = speler(g.speler);
      const naam = p ? p.naam : (a.namen && a.namen[g.speler]);
      if (!naam) return;                       /* maker onbekend: telt alleen mee in de stand */
      pak(p ? 'id:' + p.id : 'naam:' + naam, naam).doelpunten++;
    });
  });
  return Object.keys(per).map(k => per[k]).sort((a, b) => b.seconden - a.seconden);
}

/* Presentie per speler: het hele seizoen, en de laatste vier apart.
   Die laatste vier zijn wat telt als je zaterdag een basisopstelling maakt. */
function presentieHtml() {
  if (!s.trainingen.length) return '';
  const rijen = s.spelers.map(p => {
    const alles = presentie(p.id, 0);
    const recent = presentie(p.id, 4);
    return { naam: p.naam, alles: alles, recent: recent };
  }).filter(r => r.alles.totaal > 0)
    .sort((a, b) => (a.recent.er / Math.max(1, a.recent.totaal)) - (b.recent.er / Math.max(1, b.recent.totaal)) ||
                    a.naam.localeCompare(b.naam));
  if (!rijen.length) return '';

  return '<h2>Presentie training</h2>' +
    '<p class="uitleg">Bovenaan wie de laatste vier keer het minst kwam. Rechts staat die laatste vier.</p>' +
    '<table class="uitslag">' + rijen.map(r =>
      '<tr><td>' + veiligeTekst(r.naam) +
      '<span class="sub">' + r.alles.er + ' van de ' + r.alles.totaal + ' dit seizoen</span></td>' +
      '<td class="m' + (mager(r.recent) ? ' mager' : '') + '">' + r.recent.er + '/' + r.recent.totaal + '</td></tr>'
    ).join('') + '</table>';
}

/* Minder dan de helft van de laatste vier: dat is het gesprek waard. */
function mager(recent) { return recent.totaal >= 2 && recent.er * 2 < recent.totaal; }

function schermSeizoen() {
  const d = document.createElement('div');
  d.className = 'pad';
  const terug = '<div class="knoprij" style="padding-left:0;margin-top:16px">' +
    '<button class="prim" onclick="naarScherm(\'instellen\')">Terug</button></div>';

  if (!s.archief.length && !s.trainingen.length) {
    d.innerHTML = '<h2>Seizoen</h2><p class="uitleg">Nog geen bewaarde wedstrijden en geen trainingen. ' +
      'Sluit een wedstrijd af en bewaar hem, dan telt hij hier mee.</p>' + terug;
    return d;
  }
  if (!s.archief.length) {
    d.innerHTML = '<h2>Seizoen</h2><p class="uitleg">Nog geen bewaarde wedstrijden.</p>' +
      presentieHtml() + terug;
    return d;
  }

  let gew = 0, gel = 0, ver = 0, voor = 0, tegen = 0, seconden = 0;
  s.archief.forEach(a => {
    const st = a.stand || [0, 0];
    voor += st[0]; tegen += st[1];
    if (st[0] > st[1]) gew++; else if (st[0] === st[1]) gel++; else ver++;
    seconden += a.duur || 0;
  });

  const rijen = seizoenTotalen();
  let html = '<h2>Seizoen</h2>' +
    '<p style="font-size:22px;font-weight:700;margin:0 0 4px">' +
      s.archief.length + (s.archief.length === 1 ? ' wedstrijd' : ' wedstrijden') +
      ' \u00b7 ' + gew + 'W ' + gel + 'G ' + ver + 'V</p>' +
    '<p class="uitleg">' + voor + ' voor, ' + tegen + ' tegen \u00b7 ' +
      Math.round(seconden / 60) + ' minuten voetbal</p>';

  const makers = rijen.filter(r => r.doelpunten > 0)
    .sort((a, b) => b.doelpunten - a.doelpunten || b.seconden - a.seconden);
  if (makers.length) {
    html += '<h2>Topscorers</h2><ul class="log">' + makers.map(r =>
      '<li><b>' + r.doelpunten + '\u00d7</b><span>' + veiligeTekst(r.naam) + '</span></li>').join('') + '</ul>';
  }

  html += '<h2>Speeltijd totaal</h2>' + speeltijdHtml(rijen.map(r => ({
    naam: r.naam,
    seconden: r.seconden,
    sub: r.wedstrijden + (r.wedstrijden === 1 ? ' wedstrijd' : ' wedstrijden') +
      ' \u00b7 gem. ' + Math.round(r.seconden / 60 / Math.max(1, r.wedstrijden)) + ' min' +
      (r.keeper ? ' \u00b7 ' + Math.round(r.keeper / 60) + ' min in het doel' : ''),
  })));

  html += '<p class="uitleg" style="margin-top:12px">Opgeteld over alles wat in het archief staat. ' +
    'Een wedstrijd waarin iemand niet in het veld kwam, telt bij hem niet als wedstrijd mee.</p>';

  html += presentieHtml() + terug;

  d.innerHTML = html;
  return d;
}

function startOpzet() {
  const tegen = (document.getElementById('tegenstander') || {}).value || '';
  const thuis = ((document.getElementById('thuisuit') || {}).value || 'thuis') === 'thuis';
  s.formatie = (document.getElementById('formatie') || {}).value || s.formatie;
  s.helftMinuten = parseInt((document.getElementById('helft') || {}).value, 10) || 35;
  if (!s.spelers.length) { alert('Zet eerst je selectie erin.'); return; }
  nieuweWedstrijd(tegen, thuis);
  vulUitStandaard(s.wedstrijd);
  opzetVoor = 'wedstrijd';
  bewaar();
  naarScherm('opzet');
  scherm = 'opzet';
  tekenOpzet();
}

/* De wedstrijd begint met de standaardopstelling, voor zover die nog klopt. */
function vulUitStandaard(w) {
  const st = s.standaard;
  if (st && st.formatie === w.formatie) {
    Object.keys(st.opstelling).forEach(plek => {
      const id = st.opstelling[plek];
      if (id && speler(id)) w.opstelling[plek] = id;
    });
  }
  const inVeld = Object.keys(w.opstelling).map(k => w.opstelling[k]).filter(Boolean);
  w.bank = s.spelers.map(p => p.id).filter(id => inVeld.indexOf(id) === -1);
}

/* ---------- standaardopstelling ---------- */
function standaardOpzetten() {
  if (!s.spelers.length) { alert('Zet eerst je selectie erin.'); return; }
  if (!s.standaard) s.standaard = { formatie: s.formatie, opstelling: {}, bank: [] };
  const st = s.standaard;
  if (!FORMATIES[st.formatie]) st.formatie = s.formatie;
  const ids = s.spelers.map(p => p.id);
  Object.keys(st.opstelling).forEach(plek => {          /* vertrokken spelers eruit */
    if (ids.indexOf(st.opstelling[plek]) === -1) delete st.opstelling[plek];
  });
  const inVeld = Object.keys(st.opstelling).map(k => st.opstelling[k]).filter(Boolean);
  st.bank = ids.filter(id => inVeld.indexOf(id) === -1);   /* nieuwe spelers erbij */
  opzetVoor = 'standaard';
  gekozenPlek = null;
  scherm = 'opzet';
  tekenOpzet();
}

function standaardKlaar() {
  gekozenPlek = null;
  opzetVoor = 'wedstrijd';
  bewaar();
  naarScherm('instellen');
}

function standaardWissen() {
  if (!confirm('De standaardopstelling weggooien?')) return;
  s.standaard = null;
  opzetVoor = 'wedstrijd';
  bewaar();
  naarScherm('instellen');
}

/* ---------- opstelling maken ---------- */
function tekenOpzet() {
  const doel = document.getElementById('scherm');
  const standaard = opzetVoor === 'standaard';
  const w = standaard ? s.standaard : s.wedstrijd;
  doel.innerHTML = '';
  document.getElementById('klokbalk').classList.add('verborgen');
  document.getElementById('stand').classList.add('verborgen');
  document.getElementById('kop').textContent = standaard ? 'Standaardopstelling' : 'Opstelling';
  const menuknop = document.getElementById('menuknop');
  menuknop.textContent = 'Terug';
  menuknop.onclick = () => { opzetVoor = 'wedstrijd'; naarScherm('instellen'); };

  const d = document.createElement('div');
  d.className = 'veldscherm zonderklok';
  const veldrij = document.createElement('div');
  veldrij.className = 'veldrij';
  veldrij.appendChild(tekenVeld(true, w));
  veldrij.appendChild(bankKolom(w, {
    kop: 'Bank',
    leegtekst: 'Niemand over.',
    tik: id => zetInOpstelling(w, id),
  }));
  d.appendChild(veldrij);

  d.appendChild(balansRegel(w));

  /* wie weinig traint, ook als hij al in de opstelling staat */
  const mageren = s.spelers.filter(p => mager(presentie(p.id, 4)));
  if (mageren.length) {
    const let_op = document.createElement('p');
    let_op.className = 'uitleg';
    let_op.style.padding = '0 12px';
    let_op.innerHTML = 'Weinig getraind: ' + mageren.map(p => {
      const r = presentie(p.id, 4);
      return '<b class="mager">' + veiligeTekst(p.naam) + ' ' + r.er + '/' + r.totaal + '</b>';
    }).join(', ');
    d.appendChild(let_op);
  }


  const bezet = Object.values(w.opstelling).filter(Boolean).length;
  const knoppen = document.createElement('div');
  knoppen.className = 'knoprij';
  knoppen.innerHTML = (standaard
      ? '<button class="prim" onclick="standaardKlaar()">Bewaren</button>' +
        '<button class="uit" onclick="standaardWissen()">Wissen</button>'
      : '<button class="prim" onclick="opstellingKlaar()">Klaar \u2014 naar de wedstrijd</button>') +
    '<span class="uitleg" style="align-self:center;margin:0">' + bezet + ' van de 11 ingevuld</span>';
  d.appendChild(knoppen);

  doel.appendChild(d);

  /* plek aantikken werkt hier anders: leeg = kiezen */
  doel.querySelectorAll('.plek').forEach((el, i) => {
    const plekId = FORMATIES[w.formatie][i][0];
    el.onclick = () => {
      if (gekozenPlek === plekId) gekozenPlek = null;
      else gekozenPlek = plekId;
      tekenOpzet();
    };
  });
}

function zetInOpstelling(w, spelerId) {
  if (!gekozenPlek) { alert('Tik eerst een plek op het veld aan.'); return; }
  const oud = w.opstelling[gekozenPlek];
  w.opstelling[gekozenPlek] = spelerId;
  w.bank = w.bank.filter(x => x !== spelerId);
  if (oud) w.bank.push(oud);
  gekozenPlek = null;
  bewaar(); tekenOpzet();
}

/* De aantallen per linie staan al in de bank. Hier alleen nog wat er ontbreekt,
   want een linie zonder wissel is een verrassing die je liever nu hebt. */
function balansRegel(w) {
  const el = document.createElement('p');
  el.className = 'uitleg';
  el.style.cssText = 'padding: 0 12px; margin: 0 0 8px';
  const bank = w.bank.map(id => speler(id)).filter(Boolean);
  const leeg = ['A', 'M', 'V', 'K']
    .filter(code => !bank.filter(p => groepVan(p) === code).length)
    .map(code => LINIES[code].toLowerCase());
  if (!leeg.length) return el;
  el.innerHTML = '<b class="mager">Geen wissel voor ' + veiligeTekst(leeg.join(', ')) + '.</b>';
  return el;
}

function opstellingKlaar() {
  const w = s.wedstrijd;
  const bezet = Object.values(w.opstelling).filter(Boolean).length;
  if (bezet < 11 && !confirm('Er staan er ' + bezet + ' op het veld in plaats van 11. Toch doorgaan?')) return;
  gekozenPlek = null;
  bewaar();
  naarScherm('wedstrijd');
}

/* ---------- selectie ---------- */
function namenErbij() {
  const vak = document.getElementById('namen');
  if (!vak) return;
  vak.value.split('\n').map(x => x.trim()).filter(Boolean).forEach(naam => {
    s.spelers.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7), naam, linie: '' });
  });
  bewaar(); teken();
}

function spelerToevoegen() {
  const naam = prompt('Naam van de speler');
  if (!naam || !naam.trim()) return;
  s.spelers.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7), naam: naam.trim(), linie: '' });
  bewaar(); teken();
}

function wijzigSpeler(p) {
  const naam = prompt('Naam wijzigen. Laat leeg om deze speler te verwijderen.', p.naam);
  if (naam === null) return;
  if (!naam.trim()) {
    if (!confirm(p.naam + ' verwijderen uit de selectie?')) return;
    s.spelers = s.spelers.filter(x => x !== p);
  } else {
    p.naam = naam.trim();
  }
  bewaar(); teken();
}

/* ---------- overzetten tussen toestellen ---------- */
/* Alleen de voorbereiding: selectie, formatie en standaardopstelling.
   Bewaarde wedstrijden gaan niet mee, die horen bij het toestel waar ze gespeeld zijn. */
function opzetPakket() {
  return { v: 1, spelers: s.spelers, formatie: s.formatie, helftMinuten: s.helftMinuten, standaard: s.standaard };
}

function codeMaken() {
  const vak = overzetVak();
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(opzetPakket()))));
  vak.innerHTML = '<p class="uitleg" style="margin-top:12px">Kopieer deze code en stuur hem naar je andere toestel. ' +
    'Daar op <b>Code invoeren</b> tikken en plakken.</p>';
  const tekstvak = document.createElement('textarea');
  tekstvak.value = code;
  tekstvak.readOnly = true;
  vak.appendChild(tekstvak);
  tekstvak.focus(); tekstvak.select();
  try { navigator.clipboard.writeText(code); } catch (e) { /* dan met de hand */ }
  vak.scrollIntoView({ block: 'center' });
}

function codeInvoeren() {
  const vak = overzetVak();
  vak.innerHTML = '<p class="uitleg" style="margin-top:12px">Plak hier de code van je andere toestel.</p>';
  const tekstvak = document.createElement('textarea');
  tekstvak.id = 'overzetcode';
  tekstvak.placeholder = 'Plak de code';
  vak.appendChild(tekstvak);
  const knoppen = document.createElement('div');
  knoppen.className = 'knoprij';
  knoppen.style.padding = '10px 0 0';
  knoppen.innerHTML = '<button class="prim" onclick="codeOvernemen()">Overnemen</button>';
  vak.appendChild(knoppen);
  tekstvak.focus();
  vak.scrollIntoView({ block: 'center' });
}

function overzetVak() {
  const vak = document.getElementById('overzetvak');
  vak.innerHTML = '';
  return vak;
}

function codeOvernemen() {
  const vak = document.getElementById('overzetcode');
  const rauw = (vak ? vak.value : '').trim();
  if (!rauw) return;
  let pakket;
  try { pakket = JSON.parse(decodeURIComponent(escape(atob(rauw)))); }
  catch (e) { alert('Deze code kon ik niet lezen. Is hij helemaal meegekomen?'); return; }
  if (!pakket || !Array.isArray(pakket.spelers) || !pakket.spelers.length) {
    alert('In deze code zit geen selectie.'); return;
  }
  if (!confirm('De selectie op dit toestel vervangen door ' + pakket.spelers.length + ' spelers uit de code?\n\n' +
               'Je bewaarde wedstrijden blijven staan.')) return;
  s.spelers = pakket.spelers;
  if (FORMATIES[pakket.formatie]) s.formatie = pakket.formatie;
  if (pakket.helftMinuten) s.helftMinuten = pakket.helftMinuten;
  s.standaard = pakket.standaard || null;
  bewaar();
  alert('Overgenomen.');
  naarScherm('instellen');
}

function exporteer() {
  const tekst = JSON.stringify({ spelers: s.spelers.map(p => p.naam), archief: s.archief }, null, 2);
  const vak = document.createElement('textarea');
  vak.value = tekst;
  vak.style.cssText = 'width:100%;min-height:240px;margin-top:12px';
  const doel = document.getElementById('scherm');
  doel.appendChild(vak);
  vak.scrollIntoView({ block: 'center' });
  vak.select();
  alert('Alles staat als tekst onderin. Kopieer het en bewaar het waar je wilt.');
}

/* ==========================================================
   Synchroniseren met Supabase
   Alleen de voorbereiding en de geschiedenis gaan mee: selectie, standaard-
   opstelling, trainingen en archief. Een lopende wedstrijd blijft op het toestel
   waar hij gespeeld wordt; die wil je niet kwijtraken door een druk op de knop
   op je laptop.
   ========================================================== */

function laadSessie() {
  try { sessie = JSON.parse(localStorage.getItem(SESSIESLEUTEL)); }
  catch (e) { sessie = null; }
}
function bewaarSessie() {
  try { localStorage.setItem(SESSIESLEUTEL, JSON.stringify(sessie)); } catch (e) { /* stil */ }
}
function vergeetSessie() {
  sessie = null;
  try { localStorage.removeItem(SESSIESLEUTEL); } catch (e) { /* stil */ }
}

function zetSessie(d) {
  const oud = sessie || {};
  sessie = {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    verloopt: Date.now() + ((d.expires_in || 3600) * 1000),
    user_id: d.user ? d.user.id : oud.user_id,
    email: d.user ? d.user.email : oud.email,
    teamId: oud.teamId || null,
    versie: oud.versie || 0,
    laatst: oud.laatst || null,
  };
  bewaarSessie();
}

async function sb(pad, opties) {
  opties = opties || {};
  const kop = { 'apikey': SUPABASE.sleutel, 'Content-Type': 'application/json' };
  Object.keys(opties.headers || {}).forEach(k => { kop[k] = opties.headers[k]; });
  if (opties.metToken !== false && sessie && sessie.access_token) {
    kop['Authorization'] = 'Bearer ' + sessie.access_token;
  }
  const r = await fetch(SUPABASE.url + pad, {
    method: opties.method || 'GET', headers: kop, body: opties.body,
  });
  const tekst = await r.text();
  let data = null;
  try { data = tekst ? JSON.parse(tekst) : null; } catch (e) { data = tekst; }
  if (!r.ok) {
    const fout = new Error((data && (data.message || data.msg || data.error_description)) || ('fout ' + r.status));
    fout.status = r.status;
    fout.data = data;
    throw fout;
  }
  return data;
}

/* Het token is een uur geldig; op tijd vernieuwen scheelt opnieuw inloggen. */
async function zorgVoorToken() {
  if (!sessie || !sessie.refresh_token) return false;
  if (sessie.verloopt && Date.now() < sessie.verloopt - 60000) return true;
  try {
    const d = await sb('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', metToken: false,
      body: JSON.stringify({ refresh_token: sessie.refresh_token }),
    });
    zetSessie(d);
    return true;
  } catch (e) {
    vergeetSessie();
    return false;
  }
}

/* ---------- terugkomen uit de mail ---------- */
/* Een magic link stuurt je terug met de sleutels in het adres, achter een #.
   Die halen we eruit, zetten we weg en poetsen we meteen uit de adresbalk. */
function schoonAdres() {
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* stil */ }
}

async function pakInlogUitLink() {
  const h = location.hash || '';
  if (h.indexOf('access_token=') === -1) {
    if (h.indexOf('error') !== -1) {
      const f = new URLSearchParams(h.replace(/^#/, ''));
      syncMelding = 'Inloggen via de link lukte niet: ' +
        (f.get('error_description') || f.get('error') || 'onbekende fout');
      schoonAdres();
      scherm = 'instellen';
    }
    return;
  }
  const f = new URLSearchParams(h.replace(/^#/, ''));
  const oud = sessie || {};
  sessie = {
    access_token: f.get('access_token'),
    refresh_token: f.get('refresh_token'),
    verloopt: Date.now() + ((parseInt(f.get('expires_in'), 10) || 3600) * 1000),
    user_id: oud.user_id || null, email: oud.email || null,
    teamId: oud.teamId || null, versie: oud.versie || 0, laatst: oud.laatst || null,
  };
  schoonAdres();
  try {
    const u = await sb('/auth/v1/user');       /* wie ben je, zodat het team op naam kan */
    sessie.user_id = u.id;
    sessie.email = u.email;
  } catch (e) { /* dan vult zorgVoorTeam het later aan */ }
  bewaarSessie();
  syncMelding = 'Ingelogd via de link.';
  scherm = 'instellen';
  teken();
}

/* ---------- inloggen met een code uit de mail ---------- */
async function stuurInlogcode() {
  const veld = document.getElementById('sync-email');
  const email = veld ? veld.value.trim() : '';
  if (!email) { meldSync('Vul je e-mailadres in.'); return; }
  meldSync('Bezig met versturen\u2026');
  try {
    const terug = location.origin + location.pathname;
    await sb('/auth/v1/otp?redirect_to=' + encodeURIComponent(terug), {
      method: 'POST', metToken: false,
      body: JSON.stringify({ email: email, create_user: true }),
    });
    inlogEmail = email;
    inlogFase = 'code';
    syncMelding = 'Mail verstuurd naar ' + email + '. Kijk ook in je spam.';
    teken();
  } catch (e) {
    meldSync('Versturen lukte niet: ' + e.message);
  }
}

async function controleerInlogcode() {
  const veld = document.getElementById('sync-code');
  const code = veld ? veld.value.trim() : '';
  if (!code) { meldSync('Vul de code uit de mail in.'); return; }
  meldSync('Bezig met inloggen\u2026');
  try {
    const d = await sb('/auth/v1/verify', {
      method: 'POST', metToken: false,
      body: JSON.stringify({ email: inlogEmail, token: code, type: 'email' }),
    });
    zetSessie(d);
    inlogFase = 'email';
    syncMelding = 'Ingelogd.';
    teken();
  } catch (e) {
    meldSync('Deze code klopt niet of is verlopen: ' + e.message);
  }
}

function uitloggen() {
  if (!confirm('Uitloggen op dit toestel?\n\nJe gegevens blijven gewoon staan.')) return;
  vergeetSessie();
  syncMelding = '';
  teken();
}

/* ---------- team ---------- */
async function zorgVoorTeam() {
  if (sessie.teamId) return sessie.teamId;
  const rijen = await sb('/rest/v1/teams?select=id&order=gemaakt.asc&limit=1');
  if (rijen && rijen.length) {
    sessie.teamId = rijen[0].id;
  } else {
    const nieuw = await sb('/rest/v1/teams', {
      method: 'POST', headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ naam: 'O14', eigenaar: sessie.user_id }),
    });
    sessie.teamId = nieuw[0].id;
  }
  bewaarSessie();
  return sessie.teamId;
}

/* ---------- wat er over de lijn gaat ---------- */
function syncPakket() {
  return {
    spelers: s.spelers, formatie: s.formatie, helftMinuten: s.helftMinuten,
    standaard: s.standaard, trainingen: s.trainingen, archief: s.archief,
    verslagWissels: s.verslagWissels,
  };
}

function neemPakketOver(d) {
  if (!d || !Array.isArray(d.spelers)) return false;
  s.spelers = d.spelers;
  if (FORMATIES[d.formatie]) s.formatie = d.formatie;
  if (d.helftMinuten) s.helftMinuten = d.helftMinuten;
  s.standaard = d.standaard || null;
  s.trainingen = Array.isArray(d.trainingen) ? d.trainingen : [];
  s.archief = Array.isArray(d.archief) ? d.archief : [];
  s.verslagWissels = !!d.verslagWissels;
  bewaar();
  return true;
}

function isVersieBotsing(e) {
  const c = e.data && e.data.code;
  return c === '40001' || /versie loopt niet gelijk/.test(e.message || '');
}

async function opsturen(overschrijven) {
  if (!sessie) return;
  meldSync('Bezig met opsturen\u2026');
  try {
    if (!(await zorgVoorToken())) { syncMelding = 'Je bent uitgelogd, log opnieuw in.'; teken(); return; }
    const team = await zorgVoorTeam();
    let verwacht = sessie.versie || null;
    if (overschrijven) {                       /* eerst kijken wat er staat, dan er overheen */
      const nu = await sb('/rest/v1/team_toestand?select=versie&team_id=eq.' + team);
      verwacht = nu && nu.length ? nu[0].versie : null;
    }
    const r = await sb('/rest/v1/rpc/toestand_opslaan', {
      method: 'POST',
      body: JSON.stringify({ p_team_id: team, p_data: syncPakket(), p_verwachte_versie: verwacht }),
    });
    sessie.versie = r ? r.versie : (sessie.versie || 0) + 1;
    sessie.laatst = new Date().toISOString();
    bewaarSessie();
    syncMelding = 'Opgestuurd.';
    teken();
  } catch (e) {
    if (isVersieBotsing(e)) {
      syncMelding = 'Op de server staat iets nieuwers, van een ander toestel. ' +
        'Haal het eerst op, of stuur dit toestel er met opzet overheen.';
    } else {
      syncMelding = 'Opsturen lukte niet: ' + e.message;
    }
    teken();
  }
}

async function ophalen() {
  if (!sessie) return;
  if (!confirm('De selectie, standaardopstelling, trainingen en het archief op dit toestel ' +
               'vervangen door wat er op de server staat?')) return;
  meldSync('Bezig met ophalen\u2026');
  try {
    if (!(await zorgVoorToken())) { syncMelding = 'Je bent uitgelogd, log opnieuw in.'; teken(); return; }
    const team = await zorgVoorTeam();
    const rijen = await sb('/rest/v1/team_toestand?select=data,versie&team_id=eq.' + team);
    if (!rijen || !rijen.length) { syncMelding = 'Er staat nog niets op de server.'; teken(); return; }
    if (!neemPakketOver(rijen[0].data)) { syncMelding = 'Wat er staat kon ik niet lezen.'; teken(); return; }
    sessie.versie = rijen[0].versie;
    sessie.laatst = new Date().toISOString();
    bewaarSessie();
    syncMelding = 'Opgehaald.';
    teken();
  } catch (e) {
    syncMelding = 'Ophalen lukte niet: ' + e.message;
    teken();
  }
}

function meldSync(tekst) {
  syncMelding = tekst;
  const el = document.getElementById('syncstatus');
  if (el) el.textContent = tekst; else teken();
}

function syncHtml() {
  let html = '<h2>Synchroniseren</h2>';
  if (!sessie) {
    html += '<p class="uitleg">Log in met je e-mailadres, dan staan je laptop en je telefoon gelijk. ' +
      'Je krijgt een code in de mail; geen wachtwoord om te onthouden.</p>';
    if (inlogFase === 'email') {
      html += '<label class="vak">E-mailadres<input id="sync-email" type="email" inputmode="email" ' +
        'autocomplete="email" placeholder="jij@voorbeeld.nl" value="' + veiligeTekst(inlogEmail) + '"></label>' +
        '<div class="knoprij" style="padding-left:0"><button class="prim" onclick="stuurInlogcode()">Stuur code</button></div>';
    } else {
      html += '<p class="uitleg">Staat er een <b>link</b> in de mail? Klik die op dit toestel, dan ben je binnen. ' +
        'Staat er een <b>code</b> in, vul hem hieronder in.</p>' +
        '<label class="vak">Code uit de mail<input id="sync-code" type="text" inputmode="numeric" ' +
        'autocomplete="one-time-code" placeholder="123456"></label>' +
        '<div class="knoprij" style="padding-left:0">' +
        '<button class="prim" onclick="controleerInlogcode()">Inloggen</button>' +
        '<button onclick="opnieuwInloggen()">Ander adres</button></div>';
    }
  } else {
    html += '<p class="uitleg">Ingelogd als <b>' + veiligeTekst(sessie.email || '') + '</b>.' +
      (sessie.laatst ? ' Laatst gelijkgezet ' + veiligeTekst(datumTijdKort(sessie.laatst)) + '.' : '') +
      ' Een lopende wedstrijd gaat nooit mee; die blijft op dit toestel.</p>' +
      '<div class="knoprij" style="padding-left:0">' +
      '<button class="prim" onclick="opsturen(false)">Opsturen</button>' +
      '<button onclick="ophalen()">Ophalen</button>' +
      '<button onclick="uitloggen()">Uitloggen</button></div>';
    if (/nieuwers/.test(syncMelding)) {
      html += '<div class="knoprij" style="padding-left:0"><button class="uit" onclick="opsturen(true)">' +
        'Toch dit toestel opsturen</button></div>';
    }
  }
  html += '<p class="uitleg" id="syncstatus" style="margin-top:8px">' + veiligeTekst(syncMelding) + '</p>';
  return html;
}

function opnieuwInloggen() { inlogFase = 'email'; syncMelding = ''; teken(); }

function datumTijdKort(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) + ' om ' +
           d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

/* ---------- hulpjes ---------- */
function speler(id) { return s.spelers.find(p => p.id === id) || null; }
function naamVan(id) { const p = speler(id); return p ? p.naam : 'onbekend'; }
function veiligeTekst(t) {
  return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- scherm wakker houden ---------- */
async function pakWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { wakeLock = null; }
}
function losWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && s.wedstrijd && s.wedstrijd.loopt) pakWakeLock();
});

/* ---------- start ---------- */
laad();
laadSessie();
teken();
pakInlogUitLink();
/* Stond de app al open toen je de link aantikte? Dan verandert alleen het adres. */
window.addEventListener('hashchange', () => pakInlogUitLink());
tikker = setInterval(() => {
  const w = s.wedstrijd;
  if (w && w.loopt && scherm === 'wedstrijd') {
    const k = document.getElementById('klok');
    if (k) k.textContent = mmss(verstreken());
  }
}, 1000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
