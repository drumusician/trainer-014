# Het Xcode-project wordt hieruit gemaakt: `xcodegen` in deze map.
# Het project zelf staat ook in git, zodat je het zonder xcodegen kunt openen.
name: Blaadje
options:
  bundleIdPrefix: app.blaadje
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
packages:
  BlaadjeKern:
    path: ../BlaadjeKern
targets:
  Blaadje:
    type: application
    platform: iOS
    sources:
      - Bron
      - Assets.xcassets
    dependencies:
      - package: BlaadjeKern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blaadje.ios
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blaadje
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N72Z597PXN
  BlaadjeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Blaadje
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  BlaadjeSchermTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SchermTests
    dependencies:
      - target: Blaadje
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Blaadje
schemes:
  Blaadje:
    build:
      targets:
        Blaadje: all
        BlaadjeTests: [test]
        BlaadjeSchermTests: [test]
    test:
      targets:
        - BlaadjeTests
        - BlaadjeSchermTests
